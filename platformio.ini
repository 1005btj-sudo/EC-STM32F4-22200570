; ============================================================
;  Embedded Controller (EC) - Handong Global University
;  PlatformIO workspace configuration
; ============================================================

[platformio]
src_dir = .
include_dir = include

[env]
platform = ststm32
board = nucleo_f411re
framework = cmsis
debug_tool = stlink
build_flags = -Wl,-u,_print_float,-u,_scanf_float, -std=c11, -O3

; ---------- (A) Tutorial: Create Project (ecSTM32_simple 사용) ----------

[env:TU_CreateProject_Example1]
build_src_filter = +<tutorial/TU_CreateProject_VSC/TU_CreateProject_Example1_main.c> +<include/*.c> -<include/ecRCC2.c> -<include/ecGPIO2.c> -<include/ecSysTick2.c> -<include/ecEXTI2.c> -<include/ecStepper2.c> -<include/ecUART2.c> -<include/ecTIM2.c> -<include/ecPWM2.c> -<include/ecICAP2.c>

[env:TU_CreateProject_Example2]
build_src_filter = +<tutorial/TU_CreateProject_VSC/TU_CreateProject_Example2_main.c> +<include/*.c> -<include/ecRCC2.c> -<include/ecGPIO2.c> -<include/ecSysTick2.c> -<include/ecEXTI2.c> -<include/ecStepper2.c> -<include/ecUART2.c> -<include/ecTIM2.c> -<include/ecPWM2.c> -<include/ecICAP2.c>

; ---------- (B) Tutorial: GPIO Digital Out / InOut (ecRCC2 사용) ----------

[env:TU_GPIO_Digital_Out_LED]
build_src_filter = +<tutorial/TU_GPIO_Digital_Out_LED_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:TU_GPIO_Digital_InOut_Button]
build_src_filter = +<tutorial/TU_GPIO_Digital_InOut_Button_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

; ---------- (B) LAB: GPIO Digital InOut (eval board) ----------

[env:LAB_GPIO_DIO_LED_Photosensor]
build_src_filter = +<lab/LAB_GPIO_DIO_LED/LAB_GPIO_DIO_LED_Photosensor_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_GPIO_DIO_multiLED]
build_src_filter = +<lab/LAB_GPIO_DIO_LED/LAB_GPIO_DIO_multiLED_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

; ---------- (C) LAB: GPIO 7-segment (eval board) ----------

[env:LAB_GPIO_7segment]
build_src_filter = +<lab/LAB_GPIO_7segment/LAB_GPIO_7segment_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_GPIO_7segment_P1]
build_src_filter = +<lab/LAB_GPIO_7segment/LAB_GPIO_7segment_P1.c> +<include/*.c> -<include/ecSTM32_simple.c>

; ---------- (D) Tutorial: SysTick (ecRCC2 + ecSysTick2 사용) ----------

[env:TU_SysTick]
build_src_filter = +<tutorial/TU_SysTick/TU_SysTick_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

; ---------- (D) Tutorial: EXTI  (PreLAB: External Interrupt, Exercise 2) ----------

[env:TU_EXTI]
build_src_filter = +<tutorial/TU_EXTI/TU_EXTI_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

; ---------- (D) LAB: EXTI & SysTick (eval board) ----------

[env:LAB_EXTI]
build_src_filter = +<lab/LAB_EXTI/LAB_EXTI_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

; ---------- (E) LAB: Stepper Motor (28BYJ-48 + ULN2003) ----------

[env:LAB_Stepper_Motor]
build_src_filter = +<lab/LAB_Stepper_Motor/LAB_Stepper_Motor_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

; ---------- (F) LAB: USART - Bluetooth (USART2 = ST-Link USB, USART1 = PA9 TX / PA10 RX) ----------

[env:TU_USART_testrun]
build_src_filter = +<lab/LAB_USART_LED_Bluetooth/TU_USART_testrun_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_USART_LED]
build_src_filter = +<lab/LAB_USART_LED_Bluetooth/LAB_USART_LED_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_USART_Bluetooth]
build_src_filter = +<lab/LAB_USART_LED_Bluetooth/LAB_USART_Bluetooth_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

; ---------- (G) LAB: Timer & PWM (RC servo SG90, DC motor) ----------

[env:LAB_PWM_RC]
build_src_filter = +<lab/LAB_PWM/LAB_PWM_RC_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:LAB_PWM_DC]
build_src_filter = +<lab/LAB_PWM/LAB_PWM_DC_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>

; ---------- (H) LAB: Input Capture - Ultrasonic (HC-SR04) ----------

[env:LAB_TIMER_ICAP]
build_src_filter = +<lab/LAB_TIMER_ICAP/LAB_TIMER_ICAP_22200570.c> +<include/*.c> -<include/ecSTM32_simple.c>
